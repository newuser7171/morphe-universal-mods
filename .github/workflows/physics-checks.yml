name: Physics prototype checks

on:
  push:
    branches: [dev, main]
    paths:
      - 'tools/modify_hillclimb_physics.py'
      - 'tests/test_hillclimb_physics.py'
      - '.github/workflows/physics-checks.yml'
  pull_request:
    paths:
      - 'tools/modify_hillclimb_physics.py'
      - 'tests/test_hillclimb_physics.py'
      - '.github/workflows/physics-checks.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test physics modifier
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile python scripts
        run: python -m py_compile tools/modify_hillclimb_physics.py tools/inspect_hillclimb.py
